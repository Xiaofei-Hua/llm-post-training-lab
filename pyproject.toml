[build-system]
requires = ["hatchling>=1.27,<2"]
build-backend = "hatchling.build"

[project]
name = "llm-post-training-lab"
version = "0.1.0"
description = "Algorithm-first LLM post-training research framework"
readme = "README.md"
requires-python = ">=3.12,<3.14"
dependencies = [
    "math-verify[antlr4-13-2]==0.9.0",
    "numpy>=2,<3",
    "torch>=2.8,<3",
]

[dependency-groups]
dev = [
    "hypothesis>=6.138,<7",
    "pytest>=8.4,<10",
    "ruff>=0.12,<1",
]

[tool.pytest.ini_options]
addopts = "-ra --strict-config --strict-markers"
testpaths = ["tests"]

[tool.hatch.build.targets.wheel]
packages = ["src/posttrain_lab"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "RUF"]
