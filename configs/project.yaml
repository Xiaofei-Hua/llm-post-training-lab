project:
  name: llm-post-training-lab
  status: planning_ready_execution_conditional
  development_status: d04_full_vocabulary_reverse_kl_complete_cpu_only
  core_pipeline_modules_total: 24
  core_pipeline_modules_complete: 4
  module_catalog_total_including_extensions: 32
  extension_modules_total: 8
  extension_modules_complete: 0
  current_module: D04
  next_module: D05
  completion_denominator: core_pipeline_modules_total
  language: zh
  target: post-training-algorithm-internship-portfolio

development_environment:
  manager: uv
  python: "3.12"
  lockfile: uv.lock
  torch: "2.14.0"
  numpy: "2.5.2"
  accelerator_execution_authorized: false

module_plan:
  cpu_algorithm_framework: {ids: D01-D12, total: 12, complete: 4}
  real_model_gpu_readiness_and_pilots: {ids: D13-D20, total: 8, complete: 0}
  formal_training_evidence_and_delivery: {ids: D21-D24, total: 4, complete: 0}
  post_core_extensions: {ids: X01-X08, total: 8, complete: 0, counted_in_core: false}
  gpu_entry_module: D13
  formal_training_entry_module: D21
  gpu_execution_authorized: false

scope:
  primary_domain: verifiable_math_reasoning
  core_methods: [sft_continuation, grpo, opd]
  shadow_methods: [dpo]
  deferred_methods: [orpo, gspo, tis, prm, agentic_rl]
  non_goals: [pretraining_from_scratch, inference_optimization, production_serving, sota_chasing]

model:
  smoke_student: google/gemma-4-E2B
  main_student: google/gemma-4-E2B
  teacher_base: google/gemma-4-E4B
  teacher_construction: same_d_anchor_sft_then_freeze
  stretch_teachers: [google/gemma-4-12B, google/gemma-4-31B-it]
  fallback_policy: same_model_lower_U_or_shorter_context_then_reprofile
  freeze_non_text_encoders: true
  require_shared_tokenizer_for_opd: true

core_design:
  stage_count: 2
  student_backward_loss_tokens_per_stage: 2000000
  reset_optimizer_and_scheduler_each_stage: true
  arms:
    A0: [sft, sft]
    A1: [grpo, grpo]
    A2: [opd, opd]
    A3: [opd, grpo]
    A4: [grpo, opd]

shadow_baselines: [dpo]

budget_estimands:
  primary_matched_denominator: student_backward_loss_tokens
  audited_not_claimed_matched: [prompt_exposures, student_forward_flops, student_backward_flops]
  practical_efficiency: [all_forward_flops, all_backward_flops, rollout_tokens, accelerator_seconds, gpu_hours, peak_memory]
  cost_components: [C_anchor, C_teacher, C_arm]

data:
  sft_candidate: open-r1/OpenR1-Math-220k
  d_anchor_examples: 10000
  d_core_prompts: 2000
  d_select_examples: 500
  d_teacher_gate_examples: 500
  d_dev_examples: 500
  benchmark_contamination_check: required
  immutable_revisions: required

evaluation:
  confirmatory_primary: MATH-500
  secondary: [GSM8K, MathArena_ArXivMath_2026_06]
  hard: [AIME_2026]
  retention: [IFEval, MMLU-Pro]
  seeds: 3
  freeze_decoding: true
  minimum_meaningful_effect_pp: 2
  c1_multiplicity: holm_familywise_0.05
  c2_equivalence_band_pp: [-2, 2]

grpo_contract:
  loss_type: dr_grpo
  group_size: 8
  epsilon: 0.2
  beta: 0.0
  num_iterations: 1
  importance_sampling_level: token
  scale_rewards: group
  temperature: 1.0
  old_policy_refresh: every_generation_batch
  weight_sync: every_generation_batch
  zero_variance_group_resampling: false
  advantage_centering: group_mean
  advantage_std_correction: sample_bessel
  advantage_epsilon: 0.0001
  zero_variance_group_policy: exclude_from_backward_and_active_normalizer
  normalization: global_active_completions_times_frozen_max_completion_length
  default_low_precision_loss_compute_dtype: float32
  gradient_accumulation_reduction: sum_microbatch_losses_without_extra_division
  ddp_gradient_reduction: average_with_world_size_compensation

opd_contract:
  sampling: fully_on_policy
  num_iterations: 1
  refresh: new_current_policy_completions_every_update
  divergence: reverse_kl
  temperature: 1.0
  vocabulary: full_chunked
  loss_mask: generated_completion_through_first_eos_only
  normalization: global_logical_update_selected_token_mean
  teacher_frozen: true
  mask_coordinates: absolute_target_positions
  causal_alignment: target_t_uses_prediction_t_minus_1
  model_logit_transform_order: scale_then_final_softcap_then_temperature
  temperature_squared_rescaling: false
  default_low_precision_loss_compute_dtype: float32
  max_tokens_per_chunk: 128
  linear_projection: selected_positions_checkpointed
  teacher_gradient: stopped
  ddp_gradient_reduction: average_with_world_size_compensation

loss_token_counter:
  definition: valid_objective_positions_entering_an_executed_optimizer_update
  count_prompt_tokens: false
  count_padding_or_post_eos: false
  count_skipped_zero_variance_grpo_groups: false
  count_each_position_per_update: once

masked_causal_ce_contract:
  mask_coordinates: absolute_target_positions
  causal_alignment: target_t_uses_prediction_t_minus_1
  reduction: global_logical_update_selected_token_mean
  default_low_precision_loss_compute_dtype: float32
  linear_projection: selected_positions_chunked
  recompute_linear_ce_in_backward: true
  max_tokens_per_chunk: 128
  ddp_gradient_reduction: average

invariants:
  same_objective_uses_identical_config_hash_across_arms_and_stages: true
  qlora_requires_new_experiment_family: true

gates:
  G0: hardware_and_throughput_calibrated
  G1: data_and_evaluator_audited
  G2: base_and_sft_reproduced
  G3: reward_audit_passed
  G4: distillation_compatibility_passed
  G5: main_runs_repeated
  G6: claims_audited
