reward_verifier_contract:
  backend: math-verify
  backend_version: 0.9.0
  antlr_runtime_version: 4.13.2
  extraction: last_explicit_terminal_surface_or_concise_direct_math
  multiple_answer_policy: last_surface_wins
  malformed_last_surface_policy: fail_closed_without_fallback
  prediction_unparseable_reward: 0
  reference_unparseable_policy: fail_logical_batch
  binary_rewards: [0, 1]
  float_rounding: 12
  numeric_precision: 30
  strict_symbol_matching: true
  strict_structural_family_guard: true
  parsing_timeout_seconds: 5
  verification_timeout_seconds: 5
  max_input_chars: 32768
  max_candidate_chars: 4096
  audit_cases: 257
  audit_corpus_sha256: 45496b679cdd13971a050f9b573b2cbc4974da56b67d54a18ee1edaaaa0d50c7
